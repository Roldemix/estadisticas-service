apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadisticas
  namespace: casino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estadisticas
  template:
    metadata:
      labels:
        app: estadisticas
    spec:
      containers:
        - name: estadisticas
          image: 851725353324.dkr.ecr.us-east-1.amazonaws.com/casino/estadisticas-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "postgres.casino.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3