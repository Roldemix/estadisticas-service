apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadisticas
  namespace: casino
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estadisticas
  template:
    metadata:
      labels:
        app: estadisticas
    spec:
      containers:
        - name: estadisticas
          image: casino/estadisticas-service:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
